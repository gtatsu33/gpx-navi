<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<link rel="stylesheet" href="leaflet.css"/>
<script src="leaflet.js"></script>
<style>
  body { margin: 0; padding: 0; overflow: hidden; }
  #map  { width: 100%; height: 100vh; }
  #load { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
          font-family:sans-serif; color:#666; font-size:14px; pointer-events:none; }
  .dlg-btn {
    display:block; width:100%; text-align:left; cursor:pointer;
    border:none; background:none; padding:5px 4px;
    font-family:sans-serif; font-size:13px; line-height:1.5; border-radius:3px;
  }
  .dlg-btn:hover { background:#f0f0f0; }
</style>
</head>
<body>
<div id="map"><div id="load">地図を読み込み中…</div></div>
<script>
function _post(obj) { obj.isStreamlitMessage = true; window.parent.postMessage(obj, '*'); }
function _setH(h)   { _post({type:'streamlit:setFrameHeight', height:h}); }
function _setV(v)   { _post({type:'streamlit:setComponentValue', value:v, dataType:'json'}); }

var map=null, _layers=[], _curTrkpts=[], _curCumDist=[], _curWpts=[], _trkptToWptIdx={}, _cursorMarker=null;

function _hav(a,b,c,d){
  var R=6371000,dA=(c-a)*Math.PI/180,dB=(d-b)*Math.PI/180;
  var x=Math.sin(dA/2)*Math.sin(dA/2)+Math.cos(a*Math.PI/180)*Math.cos(c*Math.PI/180)*Math.sin(dB/2)*Math.sin(dB/2);
  return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
function _pxM(px,z,lat){return px*156543.03392*Math.cos(lat*Math.PI/180)/Math.pow(2,z);}
function _near(pts,lat,lng){
  if(!pts.length)return null;
  var mi=Infinity,mx=0;
  for(var i=0;i<pts.length;i++){var d=_hav(lat,lng,pts[i][0],pts[i][1]);if(d<mi){mi=d;mx=i;}}
  return{idx:mx,dist:mi};
}
function _nearAll(pts,lat,lng,thrM){
  var result=[];
  for(var i=0;i<pts.length;i++){
    var d=_hav(lat,lng,pts[i][0],pts[i][1]);
    if(d<=thrM)result.push({idx:i,dist:d});
  }
  return result;
}
function _cumDist(trkpts){
  var d=[0];
  for(var i=1;i<trkpts.length;i++)
    d.push(d[i-1]+_hav(trkpts[i-1][0],trkpts[i-1][1],trkpts[i][0],trkpts[i][1]));
  return d;
}
// 閾値内の候補trkptをルート距離200m以内でクラスタリングし、各クラスタの代表（最近傍）を返す
function _clusterCandidates(cands){
  if(!cands.length)return[];
  var clusters=[],cur=[cands[0]];
  for(var i=1;i<cands.length;i++){
    var gap=Math.abs(_curCumDist[cands[i].idx]-_curCumDist[cands[i-1].idx]);
    if(gap<200){cur.push(cands[i]);}
    else{clusters.push(cur);cur=[cands[i]];}
  }
  clusters.push(cur);
  return clusters.map(function(c){return c.reduce(function(a,b){return a.dist<b.dist?a:b;});});
}
function _send(evt){
  var c=map.getCenter();evt.center={lat:c.lat,lng:c.lng};evt.zoom=map.getZoom();evt.ts=Date.now();
  _setV(evt);
}
function _pin(color,label){
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="26" height="38" viewBox="0 0 26 38">'
    +'<path d="M13 1C6.9 1 2 5.9 2 12c0 9.5 11 24 11 24S24 21.5 24 12C24 5.9 19.1 1 13 1z"'
    +' fill="'+color+'" stroke="white" stroke-width="1.5"/>'
    +'<text x="13" y="16" text-anchor="middle" fill="white" font-size="10" font-weight="bold"'
    +' font-family="sans-serif">'+label+'</text></svg>';
  return L.divIcon({html:s,iconSize:[26,38],iconAnchor:[13,38],className:''});
}
function _acptIcon(){
  return L.divIcon({
    html:'<div style="width:14px;height:14px;border-radius:50%;background:white;border:2px solid #2c3e50;box-sizing:border-box;"></div>',
    iconSize:[14,14],iconAnchor:[7,7],className:''
  });
}

window._dlg = function(action,lat,lng,nidx){
  map.closePopup();
  if(action!=='cancel'){
    _send({type:'dialog_result',action:action,lat:lat,lng:lng,nearest_trkpt_idx:nidx});
  }
};

window._dlgCandidate = function(action,trkptIdx,wptIdx,lat,lng){
  map.closePopup();
  if(action==='edit'){
    _send({type:'wpt_click',wpt_idx:wptIdx});
  }else if(action==='add'){
    _send({type:'dialog_result',action:'wpt',lat:lat,lng:lng,nearest_trkpt_idx:trkptIdx});
  }
};

function _showCandidatePopup(reps,lat,lng){
  var html='<div style="min-width:210px">'
    +'<div style="font-size:11px;color:#666;padding:2px 4px 6px">📍 この付近に複数の地点があります</div>';
  reps.forEach(function(r){
    var km=(_curCumDist[r.idx]/1000).toFixed(1);
    var wi=_trkptToWptIdx[r.idx];
    if(wi!==undefined){
      var name=_curWpts[wi].name;
      html+='<button class="dlg-btn" onclick="window._dlgCandidate(\'edit\','+r.idx+','+wi+','+lat+','+lng+')">'
           +'✏ 「'+name+'」を編集 ('+km+'km)</button>';
    }else{
      html+='<button class="dlg-btn" onclick="window._dlgCandidate(\'add\','+r.idx+',-1,'+lat+','+lng+')">'
           +'＋ 新wptを追加 ('+km+'km)</button>';
    }
  });
  html+='<button class="dlg-btn" onclick="map.closePopup()">✖ キャンセル</button></div>';
  L.popup({closeButton:true,closeOnClick:false,minWidth:220})
    .setLatLng([lat,lng]).setContent(html).openOn(map);
}

function renderMap(data,height){
  var el=document.getElementById('load');if(el)el.remove();
  var trkpts=data.trkpts||[],acpts=data.acpts||[],wpts=data.wpts||[];
  _curTrkpts=trkpts;
  _curCumDist=_cumDist(trkpts);
  _curWpts=wpts;
  _trkptToWptIdx={};
  wpts.forEach(function(w,i){_trkptToWptIdx[w.trkpt_idx]=i;});

  var pyC=data.center,pyZ=data.zoom,force=data.force_center,thr=data.click_threshold_px||20;
  var sc=null;try{sc=JSON.parse(localStorage.getItem('gpxnavi_map_center')||'null');}catch(e){}
  var sz=parseInt(localStorage.getItem('gpxnavi_map_zoom')||'0')||null;
  var iC=force?pyC:(sc||pyC),iZ=force?pyZ:(sz||pyZ);
  if(force){localStorage.setItem('gpxnavi_map_center',JSON.stringify(pyC));localStorage.setItem('gpxnavi_map_zoom',String(pyZ));}
  if(!map){
    map=L.map('map').setView([iC.lat,iC.lng],iZ);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',maxZoom:19
    }).addTo(map);
    map.on('moveend',function(){
      var c=map.getCenter();
      localStorage.setItem('gpxnavi_map_center',JSON.stringify({lat:c.lat,lng:c.lng}));
      localStorage.setItem('gpxnavi_map_zoom',String(map.getZoom()));
    });
  }else{
    if(force)map.setView([iC.lat,iC.lng],iZ);
  }
  map.off('click');
  map.on('click',function(e){
    var lat=e.latlng.lat,lng=e.latlng.lng;
    var thrM=_pxM(thr,map.getZoom(),lat);
    var cands=_nearAll(_curTrkpts,lat,lng,thrM);
    if(!cands.length){
      _send({type:'click_empty',lat:lat,lng:lng});
      return;
    }
    var reps=_clusterCandidates(cands);
    if(reps.length>1){
      _showCandidatePopup(reps,lat,lng);
    }else{
      var ni=reps[0].idx;
      var content='<div style="min-width:168px">'
        +'<button class="dlg-btn" onclick="window._dlg(\'extend\','+lat+','+lng+','+ni+')">📍 ゴールを延長する</button>'
        +'<button class="dlg-btn" onclick="window._dlg(\'acpt\','+lat+','+lng+','+ni+')">⚓ アンカーポイントを挿入する</button>'
        +'<button class="dlg-btn" onclick="window._dlg(\'wpt\','+lat+','+lng+','+ni+')">🔀 ターンポイントを追加する</button>'
        +'<button class="dlg-btn" onclick="window._dlg(\'cancel\','+lat+','+lng+','+ni+')">✖ キャンセル</button>'
        +'</div>';
      L.popup({closeButton:true,closeOnClick:false,minWidth:180})
        .setLatLng([_curTrkpts[ni][0],_curTrkpts[ni][1]])
        .setContent(content).openOn(map);
    }
  });
  _layers.forEach(function(l){map.removeLayer(l);});_layers=[];
  function add(l){l.addTo(map);_layers.push(l);}
  if(trkpts.length>1)add(L.polyline(trkpts,{color:'#3498db',weight:4,opacity:0.8}));
  wpts.forEach(function(w,i){
    var m;
    if(i===0){
      m=L.marker([w.lat,w.lng],{icon:_pin('#27ae60','S')}).bindTooltip('スタート: '+w.name);
    }else if(i===wpts.length-1){
      m=L.marker([w.lat,w.lng],{icon:_pin('#c0392b','G')}).bindTooltip('ゴール: '+w.name);
    }else{
      m=L.circleMarker([w.lat,w.lng],{radius:9,color:w.color,fillColor:w.color,fillOpacity:0.9,weight:2})
        .bindTooltip('wpt:'+(i+1)+' '+w.name);
    }
    (function(wptArrIdx,wdata){
      m.on('click',function(e){
        L.DomEvent.stopPropagation(e);
        var thrM=_pxM(thr,map.getZoom(),wdata.lat);
        var cands=_nearAll(_curTrkpts,wdata.lat,wdata.lng,thrM);
        var reps=_clusterCandidates(cands);
        if(reps.length>1){
          _showCandidatePopup(reps,wdata.lat,wdata.lng);
        }else{
          _send({type:'wpt_click',wpt_idx:wptArrIdx});
        }
      });
    })(i,w);
    add(m);
  });
  acpts.forEach(function(a,i){
    var m=L.marker([a.lat,a.lng],{icon:_acptIcon(),draggable:true,zIndexOffset:500})
      .bindTooltip('acpt:'+(i+1)+' (右クリックで削除)');
    (function(idx){
      m.on('dragend',function(e){
        var pos=e.target.getLatLng();
        _send({type:'acpt_drag_end',acpt_idx:idx,lat:pos.lat,lng:pos.lng});
      });
      m.on('contextmenu',function(e){
        L.DomEvent.stopPropagation(e);
        _send({type:'acpt_delete',acpt_idx:idx});
      });
    })(i);
    add(m);
  });
  _setH(height||520);
  clearInterval(window._leafletReadyTimer);
  window._leafletReadyTimer=setInterval(function(){
    window.parent.postMessage({type:'gpxnavi_leaflet_ready'},'*');
  },1000);
  window.parent.postMessage({type:'gpxnavi_leaflet_ready'},'*');
}

function _trkptAtKm(km){
  if(!_curCumDist.length)return -1;
  var targetM=km*1000,best=0,bestDiff=Infinity;
  for(var i=0;i<_curCumDist.length;i++){
    var diff=Math.abs(_curCumDist[i]-targetM);
    if(diff<bestDiff){bestDiff=diff;best=i;}
  }
  return best;
}
function _brng(la1,lo1,la2,lo2){
  var dL=(lo2-lo1)*Math.PI/180,r1=la1*Math.PI/180,r2=la2*Math.PI/180;
  var y=Math.sin(dL)*Math.cos(r2);
  var x=Math.cos(r1)*Math.sin(r2)-Math.sin(r1)*Math.cos(r2)*Math.cos(dL);
  return(Math.atan2(y,x)*180/Math.PI+360)%360;
}
function _arrowIcon(deg){
  var s='<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">'
    +'<polygon points="12,2 22,20 12,14 2,20" fill="#e67e22" stroke="white" stroke-width="1.5"'
    +' transform="rotate('+deg+',12,12)"/></svg>';
  return L.divIcon({html:s,iconSize:[24,24],iconAnchor:[12,12],className:''});
}
function _handleElevClick(km){
  if(!_curTrkpts.length||!map)return;
  var idx=_trkptAtKm(km);
  if(idx<0)return;
  var wi=_trkptToWptIdx[idx];
  if(wi!==undefined){
    _send({type:'wpt_click',wpt_idx:wi});
    return;
  }
  var lat=_curTrkpts[idx][0],lng=_curTrkpts[idx][1];
  var content='<div style="min-width:168px">'
    +'<button class="dlg-btn" onclick="window._dlg(\'acpt\','+lat+','+lng+','+idx+')">⚓ アンカーポイントを挿入する</button>'
    +'<button class="dlg-btn" onclick="window._dlg(\'wpt\','+lat+','+lng+','+idx+')">🔀 ターンポイントを追加する</button>'
    +'<button class="dlg-btn" onclick="window._dlg(\'cancel\','+lat+','+lng+','+idx+')">✖ キャンセル</button>'
    +'</div>';
  L.popup({closeButton:true,closeOnClick:false,minWidth:180})
    .setLatLng([lat,lng]).setContent(content).openOn(map);
}
function _updateCursorMarker(km){
  if(_cursorMarker){map.removeLayer(_cursorMarker);_cursorMarker=null;}
  if(km===null||km===undefined||!_curTrkpts.length||!map)return;
  var idx=_trkptAtKm(km);
  if(idx<0)return;
  var n=_curTrkpts.length;
  var a=idx>0?idx-1:idx, b=idx<n-1?idx+1:idx;
  var deg=_brng(_curTrkpts[a][0],_curTrkpts[a][1],_curTrkpts[b][0],_curTrkpts[b][1]);
  _cursorMarker=L.marker([_curTrkpts[idx][0],_curTrkpts[idx][1]],
    {icon:_arrowIcon(deg),zIndexOffset:1000,interactive:false}
  ).addTo(map);
}
window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='streamlit:render'){
    var a=e.data.args;
    renderMap(a.data,a.height||520);
  }else if(e.data&&e.data.type==='elev_cursor'){
    _updateCursorMarker(e.data.km);
  }else if(e.data&&e.data.type==='elev_click'){
    _handleElevClick(e.data.km);
  }else if(e.data&&e.data.type==='gpxnavi_bridge_ack'){
    clearInterval(window._leafletReadyTimer);
  }
});

_post({type:'streamlit:componentReady',apiVersion:1});
</script>
</body>
</html>
